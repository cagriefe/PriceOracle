[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Scripts add the project root to sys.path before importing project modules.
"scripts/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["data", "models", "scripts", "tests", "utils"]
